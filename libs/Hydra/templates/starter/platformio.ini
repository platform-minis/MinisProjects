; Szablon projektu na frameworku Hydra.
;
; Skopiuj ten katalog, zmień nazwę urządzenia w src/main.cpp i wgraj:
;
;     pio run -e esp32s3 -t upload && pio device monitor
;
; Moduły opcjonalne włącza się flagą — nieużywany nie kosztuje ani bajta.
; Odkomentuj te, których potrzebujesz, i dopisz odpowiedni kod w main.cpp.

[env]
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -fexceptions
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    ; -D HYDRA_ENABLE_SENSE=1    ; czujniki: SensorHub, filtry, sterowniki
    ; -D HYDRA_ENABLE_NET=1      ; sieć: Wi-Fi, MQTT, mDNS
    ; -D HYDRA_ENABLE_UI=1       ; interfejs: ekrany, widżety
    ; -D HYDRA_ENABLE_MOTION=1   ; napęd: regulacja, kinematyka
    ; -D HYDRA_ENABLE_OTA=1      ; aktualizacja przez sieć
monitor_speed = 115200

; Hydra jako biblioteka lokalna. Przy pobieraniu z repozytorium zamień
; lib_extra_dirs na wpis w lib_deps.
lib_extra_dirs = ../../..

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/esp32s3_pico.hpp"'
    -D BOARD_HAS_PSRAM
board_build.psram_type = opi

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/rp2040_pico.hpp"'
