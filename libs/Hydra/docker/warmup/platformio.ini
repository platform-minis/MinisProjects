; Szkic rozgrzewkowy — jedyne zadanie: zmusić PlatformIO do pobrania
; kompletu toolchainów w trakcie budowy obrazu.
;
; Definicje środowisk muszą odpowiadać tym z ../../platformio.ini: to płytka
; i rdzeń decydują o tym, który toolchain zostanie pobrany, więc rozgrzewka
; na innej płytce ściągnęłaby coś innego, niż potem potrzebuje prawdziwy build.
;
; Flagi kompilacji celowo pominięte — tutaj nie chodzi o to, co powstanie,
; tylko o to, żeby kompilator w ogóle znalazł się w obrazie.
;
; Wzorce @PLATFORM_*@ podstawia Dockerfile z argumentów budowy, żeby wersje
; były w jednym miejscu i nie rozjechały się między obrazem a projektem.

[env]
framework = arduino

[env:esp32s3]
platform = espressif32@@PLATFORM_ESPRESSIF32@
board = esp32-s3-devkitc-1

[env:esp32c3]
platform = espressif32@@PLATFORM_ESPRESSIF32@
board = esp32-c3-devkitm-1

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#@PLATFORM_RASPBERRYPI@
board = pico
board_build.core = earlephilhower

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#@PLATFORM_RASPBERRYPI@
board = rpipico2
board_build.core = earlephilhower

[env:stm32g4]
platform = ststm32@@PLATFORM_STSTM32@
board = nucleo_g474re
; Ta sama biblioteka co w prawdziwym buildzie — pobrane archiwum zostaje
; w cache Core, więc instalacja w projekcie nie sięga już do sieci.
lib_deps = stm32duino/STM32duino FreeRTOS@^10.3.2
