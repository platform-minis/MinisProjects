; Hydra — środowiska budowania (rozdz. 12).
;
; Ten plik opisuje wyłącznie platformy; przykłady buduje się poleceniem `pio ci`,
; które podstawia wskazany szkic jako źródło i dołącza bibliotekę z bieżącego
; katalogu:
;
;   pio ci --project-conf platformio.ini --lib . -e esp32s3 examples/blink-task
;   pio ci --project-conf platformio.ini --lib . -e pico2   examples/i2c-scan
;
; Dzięki temu jedna definicja środowisk obsługuje wszystkie przykłady i nie ma
; potrzeby trzymania osobnego platformio.ini przy każdym z nich.

[env]
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -fexceptions
; Wyjątki i RTTI wyłączone (rozdz. 11) — błędy propaguje expected<T, Err>.
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
monitor_speed = 115200
; Hydra jest budowana jako biblioteka obok szkicu, więc rozpoznawanie
; zależności musi zejść w jej źródła i dalej — w biblioteki rdzenia, po które
; sięga backend HAL (SPI, Wire, Preferences/EEPROM, WiFi, mDNS, Updater)
; wraz z ich własnymi zależnościami. Wariant „chain+" zamiast „deep+", bo
; interesują nas włączenia za dyrektywami warunkowymi, a nie przeczesywanie
; wszystkich zainstalowanych bibliotek — to drugie wciągało pakiet STM32
; do budowy dla ESP32 i RP2040.
lib_ldf_mode = deep+
; Biblioteka deklarująca obsługiwane platformy ma być pomijana tam, gdzie nie
; pasuje. Bez tego pakiet FreeRTOS dla STM32 — wciągany jako zależność Hydry —
; trafiał także do budowy dla ESP32 i RP2040 i wywracał ją na stm32_def.h.
lib_compat_mode = strict
check_tool = cppcheck
check_flags = --enable=warning,performance --inline-suppr

; --- ESP32-S3 --------------------------------------------------------------
; Moduł esp32-s3-pico. FreeRTOS jest wbudowany w ESP-IDF i działa od resetu.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/esp32s3_pico.hpp"'
    -D BOARD_HAS_PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi

; --- ESP32-C3 --------------------------------------------------------------
; Jeden rdzeń RISC-V — pinowanie tasków jest ignorowane, ale API pozostaje to samo.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/esp32c3_devkit.hpp"'
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; C3 nie ma USB-OTG, tylko sprzętowe USB Serial/JTAG. Bez tej flagi rdzeń
    ; nie deklaruje `Serial` nigdzie: HardwareSerial oddaje nazwę na rzecz CDC,
    ; a HWCDC deklaruje ją dopiero przy ARDUINO_USB_MODE.
    -D ARDUINO_USB_MODE=1

; --- RP2040 ----------------------------------------------------------------
; Core Philhowera ma zintegrowany FreeRTOS SMP; scheduler startuje sam.
; Uwaga: brak FPU — regulatory pracują na Q16.16 (rozdz. 15).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/rp2040_pico.hpp"'
    ; Rdzeń Philhowera kompiluje FreeRTOS dopiero po tym przełączniku;
    ; bez niego nagłówek jądra celowo przerywa kompilację.
    -D __FREERTOS=1

; --- RP2350 ----------------------------------------------------------------
[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/rp2040_pico.hpp"'
    ; Rdzeń Philhowera kompiluje FreeRTOS dopiero po tym przełączniku;
    ; bez niego nagłówek jądra celowo przerywa kompilację.
    -D __FREERTOS=1

; --- STM32 -----------------------------------------------------------------
; Jedyna platforma, na której scheduler trzeba wystartować ręcznie —
; App::begin() robi to na końcu i nigdy nie wraca (rozdz. 4.1).
[env:stm32g4]
platform = ststm32
board = nucleo_g474re
; FreeRTOS dla STM32. Deklaracja tutaj, a nie w library.json: filtr platform
; nie działa dla zależności z rejestru, więc pakiet STM32 wciągałby się także
; do budowy dla ESP32 i RP2040.
build_flags =
    ${env.build_flags}
    -D HYDRA_BOARD_HEADER='"hydra/boards/stm32_nucleo_g474.hpp"'
    -D HAL_IWDG_MODULE_ENABLED
