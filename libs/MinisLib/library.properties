name=MinisLib
version=1.0.0
author=MinisProjects
maintainer=MinisProjects
sentence=Arduino library for MyCastle IoT platform — telemetry, heartbeat, commands over MQTT/WebSocket.
paragraph=Connects ESP32 devices to MyCastle backend via MQTT 3.1.1 over WebSocket (Aedes broker). Supports metric publishing, automatic heartbeat, command reception with JSON payload, and command ACK. Also ships MinisGfx — a universal graphics abstraction (MinisGfx.h) with software buffer backends in RGBA8888, RGB565 (TFT) and packed 1-bit monochrome (OLED/e-paper, HMSB and SSD1306 VLSB layouts), plus optional header-only wrappers over Adafruit_GFX, GxEPD2 e-paper, LovyanGFX and the MinisQt toolkit (include only the wrapper for the library you have installed).
category=Communication
