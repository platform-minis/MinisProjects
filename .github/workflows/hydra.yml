name: Hydra

# CI frameworka Hydra (libs/Hydra) — rozdz. 12 specyfikacji.
#
# Trzy poziomy kontroli, od najtańszego do najdroższego:
#   1. reguły zależności między warstwami (sekundy),
#   2. testy jednostkowe rdzenia i HAL na hoście, także pod sanitizerami,
#   3. macierz buildów wszystkich platform docelowych.
#
# Testy HIL na fizycznych płytkach (S3, Pico 2, Nucleo) przewidziane są na
# self-hosted runnerze — dokłada się je na etapie M6.

on:
  push:
    paths:
      - 'libs/Hydra/**'
      - '.github/workflows/hydra.yml'
  pull_request:
    paths:
      - 'libs/Hydra/**'
      - '.github/workflows/hydra.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: libs/Hydra

jobs:
  layers:
    name: Reguły zależności
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_includes.sh

  tests:
    name: Testy hostowe (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Kompilacja i uruchomienie
        run: |
          case "${{ matrix.mode }}" in
            normal) make -C test ;;
            asan)   make -C test asan ;;
            tsan)   make -C test tsan ;;
          esac

      - name: Przykłady i backend Arduino (kontrola składni)
        if: matrix.mode == 'normal'
        run: |
          make -C test examples
          make -C test stub

      - name: Zgodność dokumentacji z API
        if: matrix.mode == 'normal'
        run: make -C test docs

  build:
    name: ${{ matrix.env }} / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3, esp32c3, pico, pico2, stm32g4]
        example: [blink-task, i2c-scan, telemetry, mqtt-telemetry, smart-display, rover]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('libs/Hydra/platformio.ini') }}
      - name: Instalacja PlatformIO
        run: pip install --upgrade platformio
      - name: Budowanie przykładu
        working-directory: libs/Hydra
        # Czego przykład potrzebuje — modułów, pliku płytki, pominięcia na
        # danej płytce — opisuje tools/build_example.sh. Ten sam skrypt wywołuje
        # docker/hydra.sh, więc obie ścieżki nie mogą się rozjechać.
        run: tools/build_example.sh ${{ matrix.env }} ${{ matrix.example }}
