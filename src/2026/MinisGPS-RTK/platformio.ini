; MinisGPS-RTK — ESP32-S3 + Quectel LC29HDA
; Build firmware:  pio run -e esp32s3 -t upload && pio device monitor -b 115200
; Testy parsera:   pio test -e native

[platformio]
default_envs = esp32s3

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags = -std=gnu++11

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = qio
board_build.partitions = default_16MB
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8

; Przykład kompilujemy tylko na żądanie (examples/ nie wchodzi do builda biblioteki)
[env:esp32s3-example]
extends = env:esp32s3
build_src_filter = +<*> +<../examples/Lc29hBasic/>

; Parser NMEA testowany na hoście — bez Arduino (patrz src/SerialPort.h)
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Isrc
